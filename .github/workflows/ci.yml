name: SAPFlow CI Pipeline

# Required GitHub Secrets:
# WEBHOOK_SECRET        — must match GITHUB_WEBHOOK_SECRET in backend .env
# SAPFLOW_WEBHOOK_URL   — URL where SAPFlow backend is deployed
# AWS_ACCESS_KEY_ID     — for ECR push (Phase 4)
# AWS_SECRET_ACCESS_KEY — for ECR push (Phase 4)
# ECR_REGISTRY          — AWS ECR registry URL (Phase 4)
# SLACK_WEBHOOK_URL     — for Slack notifications

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      start_time: ${{ steps.record-start.outputs.start_time }}
    steps:
      - name: Record start time
        id: record-start
        run: echo "start_time=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install flake8 black pytest pytest-cov
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run black check
        working-directory: backend
        run: black --check .

      - name: Run pytest with coverage
        working-directory: backend
        env:
          SAP_MOCK_MODE: "true"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          REDIS_URL: "redis://localhost:6379"
          GITHUB_TOKEN: ""
          GITHUB_REPO: "Rajiv6165/SAPFLOW"
          WEBHOOK_SECRET: "test-secret"
          SLACK_WEBHOOK_URL: ""
          ENVIRONMENT: "development"
        run: pytest tests/ -v --tb=short

  abap-validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests httpx

      - name: Run ABAP Inspector (mock mode)
        env:
          SAP_MOCK_MODE: "true"
        run: |
          python transport-runner/test_runner.py \
            --transport-id DEVK900001 \
            --source-system DEV \
            --mock

  notify:
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Pipeline notification
        run: |
          echo "CI Pipeline completed with status: ${{ needs.test.result }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

  report-to-sapflow:
    needs: [test, abap-validation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report pipeline result to SAPFlow
        run: |
          START_TIME="${{ needs.test.outputs.start_time }}"
          END_TIME=$(date -u +%s)
          DURATION=$((END_TIME - START_TIME))

          CONCLUSION="success"
          if [ "${{ needs.test.result }}" = "failure" ] || \
             [ "${{ needs.abap-validation.result }}" = "failure" ]; then
            CONCLUSION="failure"
          fi

          echo "Pipeline conclusion: $CONCLUSION"
          echo "Duration: ${DURATION}s"

          WEBHOOK_URL="${{ secrets.SAPFLOW_WEBHOOK_URL }}"
          if [ -z "$WEBHOOK_URL" ] || [ "$WEBHOOK_URL" = "placeholder" ]; then
            echo "SAPFLOW_WEBHOOK_URL not configured, skipping webhook call"
            exit 0
          fi

          PAYLOAD=$(printf '%s' '{
            "action": "completed",
            "workflow_run": {
              "id": ${{ github.run_id }},
              "name": "${{ github.workflow }}",
              "status": "completed",
              "conclusion": "'"$CONCLUSION"'",
              "head_branch": "${{ github.ref_name }}",
              "head_sha": "${{ github.sha }}",
              "html_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "duration": '"$DURATION"'
            }
          }')

          WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET }}"
          if [ -n "$WEBHOOK_SECRET" ] && [ "$WEBHOOK_SECRET" != "placeholder" ]; then
            SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | cut -d' ' -f2)
            curl -X POST "$WEBHOOK_URL/api/v1/webhooks/github" \
              -H "Content-Type: application/json" \
              -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
              -H "X-GitHub-Event: workflow_run" \
              -d "$PAYLOAD"
          else
            echo "WEBHOOK_SECRET not configured, skipping signed webhook"
          fi